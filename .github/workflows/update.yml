name: Update News and Analysis

on:
  schedule:
    - cron: '0 */6 * * *' # 6時間ごとに自動実行（お好みで変更可能）
  workflow_dispatch:      # GitHubの画面から手動でも実行できるようにする

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 蔵書のチェックアウト (Checkout Repository)
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ニュース取得とAI分析スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_news.py

      - name: 変更されたJSONファイルを自動コミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add comments_analysis.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news analysis data automatically" && git push)
