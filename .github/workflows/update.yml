name: Update News and Analysis

on:
  schedule:
    # 日本時間の朝6:00 (UTC 21:00) と 昼12:00 (UTC 3:00) に自動実行
    - cron: '0 21,3 * * *'
  workflow_dispatch:      # 手動でも実行可能

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ニュース取得とAI分析スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_news.py

      - name: 変更されたJSONファイルを自動コミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add comments_analysis.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news analysis data automatically" && git push)
